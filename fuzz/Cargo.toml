[package]
name = "pinocchio-fuzz"
version = "0.1.0"
edition = "2021"
description = "Fuzzing harnesses for Pinocchio SDK"
license = "Apache-2.0"

[dependencies]
# Pinocchio SDK dependencies
pinocchio = { path = "../sdk/pinocchio" }

# Fuzzing dependencies
libfuzzer-sys = "0.4"
arbitrary = "1.3"

# Solana dependencies for realistic testing
solana-program = "2.2.0"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz_deserialize"
path = "fuzz_targets/fuzz_deserialize.rs"
test = false
bench = false

[[bin]]
name = "fuzz_account_info"
path = "fuzz_targets/fuzz_account_info.rs"
test = false
bench = false

[[bin]]
name = "fuzz_cpi"
path = "fuzz_targets/fuzz_cpi.rs"
test = false
bench = false

[[bin]]
name = "fuzz_instruction"
path = "fuzz_targets/fuzz_instruction.rs"
test = false
bench = false

[[bin]]
name = "fuzz_syscalls"
path = "fuzz_targets/fuzz_syscalls.rs"
test = false
bench = false

# Own workspace: cargo-fuzz builds on nightly with sanitizer flags that should
# not apply to the SDK crates.
[workspace]
